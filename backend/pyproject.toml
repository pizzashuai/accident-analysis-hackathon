[project]
name = "backend-dev"
version = "0.1.0"
requires-python = ">=3.10,<4.0"
dependencies = [
    # Shared dependencies
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.2,<3",
    "pydantic>2.0",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.16",
    "fastapi[standard]>=0.114,<1",
    "pyjwt>=2.8,<3",
    "jinja2>=3.1,<4",
    "emails>=0.6,<1",
    "tenacity>=8.2,<9",
    "python-multipart>=0.0.7,<1.0.0",
    "email-validator>=2.1.0.post1,<3.0.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "alembic>=1.12.1,<2.0.0",
    "httpx>=0.25.1,<1.0.0",
    "bcrypt==4.3.0",
    "celery>=5.3,<6",
    "redis>=5,<6",
    "boto3>=1.34,<2",
    "opencv-python>=4.10.0",
    "weasyprint>=61.0",
    "pillow>=10.0",
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[tool.mypy]
strict = false
exclude = ["venv", ".venv", "src/common/database/alembic"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.ruff]
target-version = "py310"
exclude = ["src/common/database/alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["src"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
